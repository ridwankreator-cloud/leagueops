name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapin folder www
        run: |
          mkdir www
          cp index.html *.js *.css *.png www/
          rm -f www/sw.js

      - name: Bundle font dan ikon (biar offline)
        run: python3 fetch_assets.py www

      - name: Matiin service worker (gak perlu di APK)
        run: |
          sed -i 's/if ("serviceWorker" in navigator)/if (false)/' www/index.html
          grep -c 'if (false)' www/index.html
          sed -i 's/initial-scale=1.0"/initial-scale=1.0, viewport-fit=cover"/' www/index.html
          printf '\nbody{padding-top:max(env(safe-area-inset-top,0px),34px)!important}\n.sub-layar{padding-top:max(env(safe-area-inset-top,0px),34px)!important}\n.main-menu__topbar{padding-top:calc(max(env(safe-area-inset-top,0px),34px) + 12px)!important}\n.roster-tabbar{top:calc(max(env(safe-area-inset-top,0px),34px) + 8px)!important}\n' >> www/style.css
          printf '\n.profil-modal-header{padding-top:calc(max(env(safe-area-inset-top,0px),34px) + 18px)!important}\n.profil-btn-close,.profil-btn-edit{top:calc(max(env(safe-area-inset-top,0px),34px) + 12px)!important}\n' >> www/style.css

      - name: Build project Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Mode full screen (sembunyiin status bar)
        run: |
          cat > android/app/src/main/java/com/leagueops/desk/MainActivity.java <<'EOF2'
          package com.leagueops.desk;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= 28) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  hideBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              private void hideBars() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat c =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.setSystemBarsBehavior(
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
              }
          }
          EOF2

      - name: Pakai kunci tanda tangan tetap
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LeagueOpsDesk-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
