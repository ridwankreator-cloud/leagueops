name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapin folder www
        run: |
          mkdir www
          cp index.html *.js *.css *.png www/
          rm -f www/sw.js

      - name: Bundle font dan ikon (biar offline)
        run: python3 fetch_assets.py www

      - name: Matiin service worker (gak perlu di APK)
        run: |
          sed -i 's/if ("serviceWorker" in navigator)/if (false)/' www/index.html
          grep -c 'if (false)' www/index.html

      - name: Build project Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LeagueOpsDesk-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
